name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Smoke test the CLI across separate processes
        run: |
          set -euo pipefail
          db="$(mktemp -d)/memory.db"

          # Process 1 writes; a later process must still see it, which is the
          # whole point of a persistent memory.
          agent-memory remember "the deploy script is ./deploy.sh" --tags ops --db "$db"
          agent-memory recall "deploy" --db "$db"

          export_json="$(agent-memory export --format json --db "$db")"
          echo "$export_json" | python3 -c 'import json,sys; assert json.load(sys.stdin)[0]["content"]'
